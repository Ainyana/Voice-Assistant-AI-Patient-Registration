<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patient Dashboard</title><style>body{font-family:Arial;margin:30px;background:#f5f7fb;color:#1f2937}h1{margin-bottom:8px}.card{background:white;padding:20px;border-radius:12px;box-shadow:0 2px 12px #0001;margin-top:20px}input,button{padding:10px;border:1px solid #d1d5db;border-radius:7px}button{cursor:pointer;background:#111827;color:white}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{text-align:left;padding:11px;border-bottom:1px solid #e5e7eb;font-size:14px}th{background:#f9fafb}.muted{color:#6b7280}</style></head><body><h1>Voice AI Patient Registration</h1><div class="muted">Dashboard for assessment testing</div><div class="card"><input id="lastName" placeholder="Search last name"><button onclick="loadPatients()">Search</button><button onclick="clearSearch()">Clear</button><div id="status" class="muted"></div><table><thead><tr><th>Name</th><th>DOB</th><th>Sex</th><th>Phone</th><th>Address</th><th>Created</th></tr></thead><tbody id="rows"></tbody></table></div><script>async function loadPatients(){const ln=document.getElementById('lastName').value;const url='/patients'+(ln?'?last_name='+encodeURIComponent(ln):'');const r=await fetch(url);const j=await r.json();const rows=document.getElementById('rows');rows.innerHTML='';(j.data||[]).forEach(p=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${p.first_name} ${p.last_name}</td><td>${p.date_of_birth}</td><td>${p.sex}</td><td>${p.phone_number}</td><td>${p.address_line_1}, ${p.city}, ${p.state} ${p.zip_code}</td><td>${new Date(p.created_at).toLocaleString()}</td>`;rows.appendChild(tr)});document.getElementById('status').textContent=`${(j.data||[]).length} patient(s) found`; }function clearSearch(){document.getElementById('lastName').value='';loadPatients()}loadPatients();</script></body></html>
